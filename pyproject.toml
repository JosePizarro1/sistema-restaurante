[project]
name = "sistema-restaurante"
version = "0.1.0"
dependencies = [
    "Django>=6.0",
    "psycopg2-binary>=2.9",
    "dj-database-url>=3.1",
    "gunicorn>=26.0",
    "Pillow>=12.3",
    "pusher>=3.3",
]

[tool.ruff]
extend-exclude = ["*/migrations/*"]
line-length = 180

[tool.ruff.format]
# El código legado del proyecto usa comillas simples; respetamos esa convención
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

