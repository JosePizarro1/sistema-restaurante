{% extends 'base.html' %}

{% block title %}Iniciar Sesión - RestoPOS{% endblock %}

{% block login_content %}
<div class="flex h-screen w-full items-center justify-center bg-[#F7F8FA]">
    <div class="w-full max-w-md p-8 bg-white rounded-[24px] border border-gray-100 shadow-xl shadow-gray-200/50">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary-light rounded-2xl flex items-center justify-center text-primary-custom mx-auto mb-4">
                <i class="ti ti-tools-kitchen-2 text-3xl"></i>
            </div>
            <h2 class="text-3xl font-['Outfit'] font-bold text-[#15202B]">RestoPOS</h2>
            <p class="text-sm text-gray-400 mt-1">Ingresa tus credenciales para acceder</p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            {% if form.errors %}
                <div class="p-4 bg-red-50 border border-red-100 rounded-xl text-xs font-bold text-red-600">
                    Usuario o contraseña incorrectos.
                </div>
            {% endif %}
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Usuario</label>
                <div class="relative">
                    <i class="ti ti-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                    <input type="text" name="username" class="w-full bg-gray-50 border border-gray-100 rounded-xl py-3.5 pl-12 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-custom transition-all" placeholder="Ej. admin" required autofocus>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Contraseña</label>
                <div class="relative">
                    <i class="ti ti-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                    <input type="password" name="password" class="w-full bg-gray-50 border border-gray-100 rounded-xl py-3.5 pl-12 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-custom transition-all" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="w-full btn-primary-custom py-4 rounded-xl font-bold text-sm shadow-lg shadow-[#F56B45]/25 flex items-center justify-center gap-2 cursor-pointer mt-6">
                <span>Ingresar al Sistema</span>
                <i class="ti ti-arrow-right text-lg"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
