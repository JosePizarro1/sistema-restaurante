{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RestoPOS{% endblock %}</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#F56B45',
                            hover: '#E45B36',
                            light: 'rgba(245, 107, 69, 0.1)',
                            dark: '#15202B'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Tabler Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Estilos Personalizados con Variables CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-[#F7F8FA] h-screen w-full font-['Atkinson_Hyperlegible'] text-[#15202B] overflow-hidden">

    {% if user.is_authenticated %}
    <div class="flex h-screen w-full overflow-hidden relative">
        <!-- Sidebar Reutilizable (Hamburguesa en móvil / Fijo en Desktop) -->
        {% include 'includes/sidebar.html' %}

        <!-- Área Principal de Contenido -->
        <main class="flex-1 flex flex-col overflow-hidden w-full">
            <!-- Header Reutilizable -->
            {% include 'includes/header.html' %}

            <!-- Bloque Dinámico de Contenido -->
            <div class="flex-1 overflow-y-auto custom-scrollbar">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    {% else %}
        {% block login_content %}{% endblock %}
    {% endif %}

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('toggle-sidebar');
            const closeBtn = document.getElementById('close-sidebar');
            const sidebar = document.getElementById('sidebar-menu');
            const overlay = document.getElementById('sidebar-overlay');

            function openSidebar() {
                if (sidebar && overlay) {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                }
            }

            function closeSidebar() {
                if (sidebar && overlay) {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
            }

            if (toggleBtn) toggleBtn.addEventListener('click', openSidebar);
            if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
            if (overlay) overlay.addEventListener('click', closeSidebar);
        });

        // --- SweetAlert2 Toast Handler para Django Messages ---
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 3500,
            timerProgressBar: true,
            didOpen: (toast) => {
                toast.addEventListener('mouseenter', Swal.stopTimer);
                toast.addEventListener('mouseleave', Swal.resumeTimer);
            }
        });

        {% if messages %}
            {% for message in messages %}
                Toast.fire({
                    icon: "{% if message.tags == 'error' %}error{% elif message.tags == 'warning' %}warning{% elif message.tags == 'success' %}success{% else %}info{% endif %}",
                    title: "{{ message|escapejs }}"
                });
            {% endfor %}
        {% endif %}

        // --- Helper global para confirmaciones SweetAlert2 ---
        function confirmarAccion(url, titulo = '¿Estás seguro?', texto = 'Esta acción no se puede deshacer', icono = 'warning', botonConfirmar = 'Sí, continuar') {
            Swal.fire({
                title: titulo,
        // --- Global Event Delegation para Confirmaciones Unobtrusive (Buenas Prácticas REST & UX) ---
        document.addEventListener('submit', (e) => {
            const form = e.target.closest('[data-confirm-form]');
            if (!form) return;
            if (form.dataset.confirmed === 'true') return;

            e.preventDefault();
            const title = form.dataset.confirmTitle || '¿Estás seguro?';
            const text = form.dataset.confirmText || 'Esta acción no se puede deshacer.';
            const icon = form.dataset.confirmIcon || 'warning';
            const confirmBtn = form.dataset.confirmButton || 'Sí, continuar';

            Swal.fire({
                title: title,
                text: text,
                icon: icon,
                showCancelButton: true,
                confirmButtonColor: '#F56B45',
                cancelButtonColor: '#6B7280',
                confirmButtonText: confirmBtn,
                cancelButtonText: 'Cancelar',
                customClass: {
                    popup: 'rounded-2xl',
                    confirmButton: 'rounded-xl text-sm font-bold px-5 py-2.5',
                    cancelButton: 'rounded-xl text-sm font-bold px-5 py-2.5'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    form.dataset.confirmed = 'true';
                    form.submit();
                }
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
