<!-- Header Superior con Soporte para Menú de Hamburguesa Móvil -->
<header class="h-20 bg-white border-b border-gray-100 flex items-center justify-between px-4 lg:px-8 flex-shrink-0 z-40">
    <div class="flex items-center gap-3">
        <!-- Botón Hamburguesa Móvil -->
        <button id="toggle-sidebar" class="lg:hidden p-2 text-gray-600 hover:text-primary-custom focus:outline-none">
            <i class="ti ti-menu-2 text-2xl"></i>
        </button>

        <div class="flex flex-col">
            <nav class="text-[10px] lg:text-[11px] font-bold uppercase tracking-widest text-gray-400 flex items-center gap-2 mb-0.5">
                <span>Operación</span>
                <i class="ti ti-chevron-right text-[10px]"></i>
                <span class="text-gray-600">{% block breadcrumb %}Sección{% endblock %}</span>
            </nav>
            <div class="flex items-center gap-3">
                <h1 class="text-xl lg:text-2xl font-['Outfit'] font-bold mb-0">{% block page_title %}Sistema Restaurante{% endblock %}</h1>
                <span class="px-2.5 py-0.5 bg-green-50 text-green-600 text-[10px] font-bold uppercase tracking-wide rounded-full border border-green-100 hidden sm:flex items-center gap-1.5">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    Servicio activo
                </span>
            </div>
        </div>
    </div>

    <div class="flex items-center gap-4">
        <div class="bg-gray-50 px-3 lg:px-4 py-2 rounded-xl border border-gray-100 flex items-center gap-3">
            <div class="w-7 h-7 lg:w-8 lg:h-8 bg-white rounded-lg shadow-xs flex items-center justify-center text-primary-custom font-bold text-sm">
                <i class="ti ti-user"></i>
            </div>
            <div class="flex flex-col">
                <span class="text-xs font-bold">{{ user.username|capfirst }}</span>
                <span class="text-[10px] text-gray-400 hidden sm:inline">Usuario activo</span>
            </div>
        </div>
    </div>
</header>
