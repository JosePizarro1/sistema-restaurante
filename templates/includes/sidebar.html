<!-- Overlay de Fondo para Móvil -->
<div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden backdrop-blur-xs transition-opacity"></div>

<!-- Sidebar Lateral Desplegable en Móvil (Menú Hamburguesa) / Fijo en Desktop -->
<aside id="sidebar-menu" class="w-[260px] lg:w-[88px] h-full bg-white border-r border-gray-100 flex flex-col items-center py-6 gap-8 z-50 fixed lg:relative top-0 left-0 -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out shadow-2xl lg:shadow-none">
    <!-- Brand Logo / Header Móvil -->
    <div class="w-full lg:w-auto px-6 lg:px-0 flex items-center justify-between lg:justify-center">
        <div class="w-12 h-12 bg-primary-light rounded-xl flex items-center justify-center text-primary-custom">
            <i class="ti ti-tools-kitchen-2 text-2xl"></i>
        </div>
        <span class="font-['Outfit'] font-bold text-2xl lg:hidden text-[#15202B]">mesa</span>
        <button id="close-sidebar" class="lg:hidden text-gray-400 hover:text-black">
            <i class="ti ti-x text-2xl"></i>
        </button>
    </div>

    <!-- Nav Items -->
    <nav class="flex flex-col gap-4 lg:gap-6 w-full px-4 lg:px-0">
        <a class="nav-item flex lg:flex-col items-center gap-3 lg:gap-1 p-3 lg:p-0 rounded-xl group text-decoration-none transition-all" href="{% url 'pos' %}">
            <div class="w-10 h-10 lg:w-14 lg:h-14 {% if request.resolver_match.url_name == 'pos' %}bg-primary-custom text-white shadow-lg shadow-[#F56B45]/20{% else %}text-gray-400 group-hover:bg-gray-50{% endif %} rounded-xl lg:rounded-[18px] flex items-center justify-center transition-all">
                <i class="ti ti-layout-dashboard text-xl lg:text-2xl"></i>
            </div>
            <span class="text-sm lg:text-[10px] font-bold uppercase tracking-wider {% if request.resolver_match.url_name == 'pos' %}text-primary-custom{% else %}text-gray-500 group-hover:text-gray-700{% endif %}">
                Menú
            </span>
        </a>
        <a class="nav-item flex lg:flex-col items-center gap-3 lg:gap-1 p-3 lg:p-0 rounded-xl group text-decoration-none transition-all" href="{% url 'cocina' %}">
            <div class="w-10 h-10 lg:w-14 lg:h-14 {% if request.resolver_match.url_name == 'cocina' %}bg-primary-custom text-white shadow-lg shadow-[#F56B45]/20{% else %}text-gray-400 group-hover:bg-gray-50{% endif %} rounded-xl lg:rounded-[18px] flex items-center justify-center transition-all">
                <i class="ti ti-clipboard-list text-xl lg:text-2xl"></i>
            </div>
            <span class="text-sm lg:text-[10px] font-bold uppercase tracking-wider {% if request.resolver_match.url_name == 'cocina' %}text-primary-custom{% else %}text-gray-500 group-hover:text-gray-700{% endif %}">
                Cocina
            </span>
        </a>
        <a class="nav-item flex lg:flex-col items-center gap-3 lg:gap-1 p-3 lg:p-0 rounded-xl group text-decoration-none transition-all" href="{% url 'reportes' %}">
            <div class="w-10 h-10 lg:w-14 lg:h-14 {% if request.resolver_match.url_name == 'reportes' %}bg-primary-custom text-white shadow-lg shadow-[#F56B45]/20{% else %}text-gray-400 group-hover:bg-gray-50{% endif %} rounded-xl lg:rounded-[18px] flex items-center justify-center transition-all">
                <i class="ti ti-chart-bar text-xl lg:text-2xl"></i>
            </div>
            <span class="text-sm lg:text-[10px] font-bold uppercase tracking-wider {% if request.resolver_match.url_name == 'reportes' %}text-primary-custom{% else %}text-gray-500 group-hover:text-gray-700{% endif %}">
                Reportes
            </span>
        </a>
    </nav>

    <!-- Logout -->
    <div class="mt-auto flex flex-col items-center gap-4 w-full px-4 lg:px-0">
        <form action="{% url 'logout' %}" method="post" class="w-full lg:w-auto">
            {% csrf_token %}
            <button type="submit" class="w-full lg:w-12 h-12 text-gray-400 rounded-xl flex items-center justify-center lg:justify-center gap-3 lg:gap-0 hover:bg-red-50 hover:text-red-500 transition-colors border-0 bg-transparent p-3 lg:p-0" title="Cerrar sesión">
                <i class="ti ti-power text-xl lg:text-2xl"></i>
                <span class="lg:hidden text-sm font-bold text-red-500">Cerrar Sesión</span>
            </button>
        </form>
    </div>
</aside>
