<!-- Sidebar Lateral (Responsive: Menú inferior flotante en móviles/tablets pequeñas y Sidebar fijo en laptops/desktops) -->
<aside class="w-full lg:w-[88px] h-16 lg:h-full bg-white border-t lg:border-t-0 lg:border-r border-gray-100 flex flex-row lg:flex-col items-center justify-around lg:justify-start py-2 lg:py-6 gap-0 lg:gap-8 z-50 fixed lg:relative bottom-0 left-0">
    <!-- Brand Logo (Solo en Desktop) -->
    <div class="hidden lg:flex w-12 h-12 bg-primary-light rounded-xl items-center justify-center text-primary-custom mb-2">
        <i class="ti ti-tools-kitchen-2 text-2xl"></i>
    </div>

    <!-- Nav Items -->
    <nav class="flex flex-row lg:flex-col gap-6 lg:gap-6 flex-1 justify-center lg:justify-start items-center">
        <a class="nav-item flex flex-col items-center gap-1 group text-decoration-none" href="{% url 'pos' %}">
            <div class="w-10 h-10 lg:w-14 lg:h-14 {% if request.resolver_match.url_name == 'pos' %}bg-primary-custom text-white shadow-lg shadow-[#F56B45]/20{% else %}text-gray-300 group-hover:bg-gray-50{% endif %} rounded-xl lg:rounded-[18px] flex items-center justify-center transition-all">
                <i class="ti ti-layout-dashboard text-xl lg:text-2xl"></i>
            </div>
            <span class="text-[9px] lg:text-[10px] font-bold uppercase tracking-wider {% if request.resolver_match.url_name == 'pos' %}text-primary-custom{% else %}text-gray-400 group-hover:text-gray-600{% endif %}">
                Menú
            </span>
        </a>
        <a class="nav-item flex flex-col items-center gap-1 group text-decoration-none" href="{% url 'cocina' %}">
            <div class="w-10 h-10 lg:w-14 lg:h-14 {% if request.resolver_match.url_name == 'cocina' %}bg-primary-custom text-white shadow-lg shadow-[#F56B45]/20{% else %}text-gray-300 group-hover:bg-gray-50{% endif %} rounded-xl lg:rounded-[18px] flex items-center justify-center transition-all">
                <i class="ti ti-clipboard-list text-xl lg:text-2xl"></i>
            </div>
            <span class="text-[9px] lg:text-[10px] font-bold uppercase tracking-wider {% if request.resolver_match.url_name == 'cocina' %}text-primary-custom{% else %}text-gray-400 group-hover:text-gray-600{% endif %}">
                Cocina
            </span>
        </a>
        <a class="nav-item flex flex-col items-center gap-1 group text-decoration-none" href="{% url 'reportes' %}">
            <div class="w-10 h-10 lg:w-14 lg:h-14 {% if request.resolver_match.url_name == 'reportes' %}bg-primary-custom text-white shadow-lg shadow-[#F56B45]/20{% else %}text-gray-300 group-hover:bg-gray-50{% endif %} rounded-xl lg:rounded-[18px] flex items-center justify-center transition-all">
                <i class="ti ti-chart-bar text-xl lg:text-2xl"></i>
            </div>
            <span class="text-[9px] lg:text-[10px] font-bold uppercase tracking-wider {% if request.resolver_match.url_name == 'reportes' %}text-primary-custom{% else %}text-gray-400 group-hover:text-gray-600{% endif %}">
                Reportes
            </span>
        </a>
    </nav>

    <!-- Logout -->
    <div class="lg:mt-auto flex flex-col items-center gap-4">
        <form action="{% url 'logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="w-10 h-10 lg:w-12 lg:h-12 text-gray-400 rounded-xl flex items-center justify-center hover:bg-red-50 hover:text-red-500 transition-colors border-0 bg-transparent" title="Cerrar sesión">
                <i class="ti ti-power text-xl lg:text-2xl"></i>
            </button>
        </form>
    </div>
</aside>
