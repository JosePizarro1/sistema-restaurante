<!-- Sidebar Lateral -->
<aside class="w-[88px] h-full bg-white border-r border-gray-100 flex flex-shrink-0 flex-col items-center py-6 gap-8 z-20">
    <div class="w-12 h-12 bg-primary-light rounded-xl flex items-center justify-center text-primary-custom mb-2">
        <i class="ti ti-tools-kitchen-2 text-2xl"></i>
    </div>
    <nav class="flex flex-col gap-6 flex-1">
        <a class="nav-item flex flex-col items-center gap-1 group text-decoration-none" href="{% url 'pos' %}">
            <div class="w-14 h-14 {% if request.resolver_match.url_name == 'pos' %}bg-primary-custom text-white shadow-lg shadow-[#F56B45]/20{% else %}text-gray-300 group-hover:bg-gray-50{% endif %} rounded-[18px] flex items-center justify-center transition-all">
                <i class="ti ti-layout-dashboard text-2xl"></i>
            </div>
            <span class="text-[10px] font-bold uppercase tracking-wider {% if request.resolver_match.url_name == 'pos' %}text-primary-custom{% else %}text-gray-400 group-hover:text-gray-600{% endif %}">
                Menú
            </span>
        </a>
        <a class="nav-item flex flex-col items-center gap-1 group text-decoration-none" href="{% url 'cocina' %}">
            <div class="w-14 h-14 {% if request.resolver_match.url_name == 'cocina' %}bg-primary-custom text-white shadow-lg shadow-[#F56B45]/20{% else %}text-gray-300 group-hover:bg-gray-50{% endif %} rounded-[18px] flex items-center justify-center transition-all">
                <i class="ti ti-clipboard-list text-2xl"></i>
            </div>
            <span class="text-[10px] font-bold uppercase tracking-wider {% if request.resolver_match.url_name == 'cocina' %}text-primary-custom{% else %}text-gray-400 group-hover:text-gray-600{% endif %}">
                Cocina
            </span>
        </a>
        <a class="nav-item flex flex-col items-center gap-1 group text-decoration-none" href="{% url 'reportes' %}">
            <div class="w-14 h-14 {% if request.resolver_match.url_name == 'reportes' %}bg-primary-custom text-white shadow-lg shadow-[#F56B45]/20{% else %}text-gray-300 group-hover:bg-gray-50{% endif %} rounded-[18px] flex items-center justify-center transition-all">
                <i class="ti ti-chart-bar text-2xl"></i>
            </div>
            <span class="text-[10px] font-bold uppercase tracking-wider {% if request.resolver_match.url_name == 'reportes' %}text-primary-custom{% else %}text-gray-400 group-hover:text-gray-600{% endif %}">
                Reportes
            </span>
        </a>
    </nav>
    <div class="mt-auto flex flex-col items-center gap-4">
        <form action="{% url 'logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="w-12 h-12 text-gray-400 rounded-xl flex items-center justify-center hover:bg-red-50 hover:text-red-500 transition-colors border-0 bg-transparent" title="Cerrar sesión">
                <i class="ti ti-power text-2xl"></i>
            </button>
        </form>
    </div>
</aside>
